[workspace]
members = ["apps/cli", "apps/gui", "apps/eval", "apps/elevated", "crates/shared", "crates/telemetry", "crates/diagnostics", "crates/agent", "crates/nebius", "crates/tools", "crates/storage", "crates/policy", "crates/actions", "crates/store", "crates/inspect", "crates/mft", "crates/elevation"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
libc = "=0.2.189"
core-foundation = "=0.10.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["v4"] }
sha2 = { version = "=0.10.9", default-features = false }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
clap = { version = "=4.5.50", features = ["derive"] }
# SQLite compiled into the binary: no system library to install.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemInformation", "Win32_System_Services", "Win32_System_EventLog", "Win32_System_Power", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties"] }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_UpdateAgent", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_Security"] }
pcagent-shared = { path = "crates/shared" }
pcagent-telemetry = { path = "crates/telemetry" }
pcagent-diagnostics = { path = "crates/diagnostics" }
pcagent-agent = { path = "crates/agent" }
pcagent-nebius = { path = "crates/nebius" }
pcagent-tools = { path = "crates/tools" }
pcagent-storage = { path = "crates/storage" }
pcagent-policy = { path = "crates/policy" }
pcagent-actions = { path = "crates/actions" }
pcagent-store = { path = "crates/store" }
pcagent-inspect = { path = "crates/inspect" }
pcagent-mft = { path = "crates/mft" }
pcagent-elevation = { path = "crates/elevation" }

[profile.release]
lto = "thin"
strip = true

# Generated Win32/COM bindings are large; keep workspace debugging while avoiding dependency
# debug-info exhaustion on the Windows development machine (also inherited by test builds).
[profile.dev.package.windows]
debug = 0

# Native binding wrappers can exhaust LLVM while generating full binary debug information.
[profile.dev.package.pcagent-eval]
debug = 0
codegen-units = 1

[profile.dev.package.pcagent]
debug = 0
codegen-units = 1

[profile.dev.package.pcagent-gui]
debug = 0
codegen-units = 1

[profile.dev.package.pcagent-elevated]
debug = 0
codegen-units = 1
