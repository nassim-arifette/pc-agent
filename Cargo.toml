[workspace]
members = ["apps/cli", "apps/gui", "crates/shared", "crates/telemetry", "crates/diagnostics", "crates/agent", "crates/storage", "crates/policy", "crates/actions"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["v4"] }
sha2 = { version = "=0.10.9", default-features = false }
clap = { version = "=4.5.50", features = ["derive"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_System_SystemInformation"] }
pcagent-shared = { path = "crates/shared" }
pcagent-telemetry = { path = "crates/telemetry" }
pcagent-diagnostics = { path = "crates/diagnostics" }
pcagent-agent = { path = "crates/agent" }
pcagent-storage = { path = "crates/storage" }
pcagent-policy = { path = "crates/policy" }
pcagent-actions = { path = "crates/actions" }

[profile.release]
lto = "thin"
strip = true
