name: Rust validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only normalization needs write access. Test/build jobs are read-only.
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.normalize.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Normalize sources and resolve initial lockfile
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          git add -u
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: format Rust sources and lock dependencies'
            # Fast-forward only; never overwrite concurrent work.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit, command and native smoke tests (no provider credentials)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows CLI
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p pcagent
      - name: Keep Windows executable (no telemetry or keys)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcagent-windows-x64
          path: target/release/pcagent.exe
          if-no-files-found: error
          retention-days: 7
