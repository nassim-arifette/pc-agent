name: Rust validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows job also compiles the Tauri desktop app.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit, command and native smoke tests (no provider credentials)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows CLI and desktop app
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p pcagent -p pcagent-gui
      - name: Keep Windows executable (no telemetry or keys)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcagent-windows-x64
          path: target/release/pcagent.exe
          if-no-files-found: error
          retention-days: 7
      - name: Keep Windows desktop app (no telemetry or keys)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pcagent-gui-windows-x64
          path: target/release/pcagent-gui.exe
          if-no-files-found: error
          retention-days: 7
