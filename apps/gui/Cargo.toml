[package]
name = "pcagent-gui"
description = "PC Agent desktop interface (Tauri) over the same core as the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pcagent-gui"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
pcagent-shared.workspace = true
pcagent-diagnostics.workspace = true
pcagent-agent.workspace = true
pcagent-tools.workspace = true
pcagent-nebius.workspace = true
pcagent-storage.workspace = true
pcagent-telemetry.workspace = true
pcagent-actions.workspace = true
# Portable: the live battery view model and its tests use the inspection types on every system.
pcagent-inspect.workspace = true
pcagent-voice.workspace = true
pcagent-report.workspace = true
pcagent-store.workspace = true

# The window only exists on Windows, the product's platform; elsewhere the binary explains that
# and the portable view code is still built and tested.
[target.'cfg(windows)'.dependencies]
pcagent-policy.workspace = true
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.0"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
